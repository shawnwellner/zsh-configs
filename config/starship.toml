# Kali-style frame + Starship Git. Directory and Git are separate bracket groups.
# Literal TOML strings so backslashes reach Starship's format parser.

add_newline = false

format = '''
[┌──\(](bold green)$username[㉿](bold green)$hostname[\)-\[](bold green)$directory[\]](bold green)([-\[](bold green)$git_branch$git_status[\]](bold green))
[└─](bold green)$cmd_duration$character
'''

[username]
show_always = true
format = '[$user]($style)'
style_user = 'bold blue'
style_root = 'bold red'

[hostname]
ssh_only = false
format = '[$hostname]($style)'
style = 'bold blue'

[directory]
truncation_length = 5
truncate_to_repo = false
format = '[$path]($style)'
style = 'bold green'

[git_branch]
format = '[$branch]($style)'
style = 'bold purple'
symbol = ''

[git_status]
format = '[$all_status$ahead_behind]($style)'
style = 'bold yellow'
ahead = ' ↑${count}'
behind = ' ↓${count}'
diverged = ' ↑${ahead_count}↓${behind_count}'
modified = ' !${count}'
staged = ' +${count}'
untracked = ' ?${count}'
stashed = ' *${count}'
conflicted = ' =${count}'
deleted = ' ✘${count}'
renamed = ' »${count}'

[cmd_duration]
min_time = 2000
format = '[took $duration]($style) '
style = 'bold yellow'

[character]
success_symbol = '[\$](bold blue)'
error_symbol = '[\$](bold red)'
vimcmd_symbol = '[\$](bold green)'
